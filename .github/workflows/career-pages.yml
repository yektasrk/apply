name: Check Career Pages

# Reads the target companies' own career pages (job_finder/company_boards.py)
# every 4 hours and appends matching Netherlands roles to the Netherlands tab.
# LinkedIn is not involved; see scrape-countries.yml for that.

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print matches without writing to the sheet or Telegram
        required: false
        default: false
        type: boolean
      company:
        description: Check only this company (as named in company_boards.py)
        required: false
        default: ""
        type: string

concurrency:
  group: career-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Write Google service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Check career pages
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          # Dedup reads the archive sheet too; job_finder.archive raises without it.
          GOOGLE_ARCHIVE_SHEET_ID: ${{ secrets.GOOGLE_ARCHIVE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          COMPANY: ${{ inputs.company }}
        run: |
          args=(--country netherlands)
          if [ "${DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "${COMPANY:-}" ]; then
            args+=(--company "$COMPANY")
          fi
          python -m job_finder.career_pages "${args[@]}"
